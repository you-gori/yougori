format_version: 2
project: my-api

resources:
  # The only sandbox reachable from the internet. It holds the accounts, the keys, the prices,
  # the credit balances and the wallet address.
  web:
    kind: environment
    spec:
      type: container
      image: python:3.12-slim
      cpu: 2
      memory: 2GB
      storage: 10GB
      working_dir: /
      files:
        - {source: ./site, target: /app/site}
      environment:
        SITE_NAME: "{{inputs.site_name}}"
        ADMIN_BOOTSTRAP_EMAIL: "{{inputs.admin_email}}"
        PAID_SANDBOX: models
        LOCAL_SANDBOX: models
        FREE_SANDBOX: models
        FREE_PORT: "8081"
        COOKIE_SECURE: "1"
        SELECTED_PROVIDERS: "{{inputs.providers}}"
        YOUGORI_INSTANCE: "{{instance}}"
      secrets:
        ADMIN_BOOTSTRAP_PASSWORD: "{{secrets.admin_password}}"
        BRIDGE_KEY: "{{secrets.bridge_key}}"
      volumes:
        - {source: my-api-data, target: /data}
      command: [python, /app/site/server.py]
      ports: [3000]
      restart: unless-stopped
      health:
        port: 3000
        path: /health

  # All providers share this private sandbox. Only selected services and tools start.
  models:
    kind: environment
    spec:
      type: container
      image: python:3.12-slim
      cpu: 4
      memory: 8GB
      storage: 60GB
      gpu: true
      files:
        - {source: ./site, target: /app}
      environment:
        SELECTED_PROVIDERS: "{{inputs.providers}}"
        CODEX_ACCESS: "{{inputs.codex_access}}"
        GEMINI_ACCESS: "{{inputs.gemini_access}}"
        KILO_SCOPE: "{{inputs.kilo_scope}}"
        KILO_ACCESS: "{{inputs.kilo_access}}"
        OPENCODE_SCOPE: "{{inputs.opencode_scope}}"
        OPENCODE_ACCESS: "{{inputs.opencode_access}}"
        OLLAMA_MODELS: /models
      secrets:
        BRIDGE_KEY: "{{secrets.bridge_key}}"
        OPENAI_API_KEY: "{{secrets.openai_key}}"
        ANTHROPIC_API_KEY: "{{secrets.anthropic_key}}"
        GEMINI_API_KEY: "{{secrets.gemini_key}}"
        KILO_API_KEY: "{{secrets.kilo_key}}"
        OPENCODE_API_KEY: "{{secrets.opencode_key}}"
      volumes:
        - {source: my-api-models, target: /models}
      command: [python, -u, /app/start-models.py]
      restart: unless-stopped

  # Only the website can reach the private model services. No model port is published.
  web_to_models:
    kind: connection
    spec:
      from: {resource: web}
      to: {resource: models}
      ports: [8080, 8081, 11434]
      direction: one_way

  # Who can open the website: a quick link or your own domain.
  site:
    kind: service_publication
    spec:
      target: {resource: web}
      port: 3000
      access: "{{inputs.web_access}}"
      domain: "{{inputs.web_domain}}"
      health:
        path: /health
        expected_status: 200

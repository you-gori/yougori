format_version: 2
project: dev-workspace

resources:
  dev:
    kind: environment
    spec:
      image: "{{inputs.image}}"
      cpu: "{{inputs.cpu}}"
      memory: "{{inputs.memory_gb}}"
      storage: "{{inputs.storage_gb}}"
      working_dir: /workspace
      ports: [3000]
      internet: true
      automatic_start: true
      restart: unless-stopped
      # The sandbox's own disk, for what the tools install and build. Your project folder is
      # synced, not mounted, so nothing here lives on it.
      volumes:
        - {source: home, target: /root}
      # Your project: the sandbox keeps its own copy at /workspace, and Yougori keeps the two in
      # step both ways. The folder itself is yours, chosen when the setup is applied.
      sync:
        - {binding: project, target: /workspace}
      # An optional folder the sandbox may read as it is, mounted read only.
      pc_access:
        - {binding: reference, target: /reference}
      permissions: {pc: true, edit: true}

  storage:
    kind: volume
    capability: data.volumes
    spec:
      size_gb: "{{inputs.storage_gb}}"

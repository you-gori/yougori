<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Yougori local environment platform" />
    <title>Yougori</title>
    <!-- Startup styles are inlined by Vite so first paint needs no assets. -->
    <!-- yougori-startup-styles -->
  </head>
  <body>
    <div id="root">
      <main class="startup-screen" aria-label="Loading Yougori" aria-busy="true">
        <div class="startup-content">
          <p class="startup-brand">Yougori</p>
          <div class="startup-track" aria-hidden="true"><span></span></div>
          <p class="startup-message" role="status">Starting your workspace…</p>
          <noscript>JavaScript is required to open Yougori.</noscript>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

format_version: 2
project: accept-borrower
resources:
  shared:
    kind: environment
    borrow: {binding: shared_env}
    spec:
      type: container
      image: alpine:3.20
  app:
    kind: environment
    spec:
      type: container
      image: alpine:3.20
      cpu: 0.5
      memory: 0.5
      storage: 2
      command: [sh, -c, "while true; do sleep 30; done"]
      internet: false
      restart: always
  link:
    kind: connection
    spec:
      from: {resource: app}
      to: {resource: shared}
      ports: [8080]
      direction: one_way

format_version: 2
kind: template
name: accept-model
title: Acceptance model
summary: A disposable model service on this computer, for the plan and review of a model attachment during runtime acceptance.
version: 1.0.0
license: MIT
topics: [test]
changelog: Acceptance fixture.
requires:
  yougori: 1.2.0
  gpu: optional
capabilities:
  - {id: models.local, selection: required}
  - {id: web.service, selection: required}
  - {id: web.private, selection: required}
  - {id: run.service, selection: required}
inputs:
  - id: model
    question: Which model should it run?
    type: text
    default: hf.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF
    group: ai_models
  - id: quantization
    question: Which size of it?
    type: text
    default: q4_k_m
    required: false
    group: ai_models

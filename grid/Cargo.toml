[package]
name = "yougori-grid"
version = "1.1.0"
description = "Closed Neo Grid: a company's private model grid on its own network"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# A tunnel carries the grid's own pinned TLS inside WebSocket frames.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
webpki-roots = "1"
rcgen = "0.14.7"
# Checks identity providers' signed tokens (RS256, ES256); the same ring TLS already uses.
ring = "0.17"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tempfile = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
# The live tunnel test runs the app's own cloudflared.
tokio = { version = "1", features = ["process"] }
# SQLite's own statement trace, for counting what a piece of core work asks the database
# (grid/src/core/bench.rs). It is here rather than in [dependencies] so that a release build of
# this crate does not carry the trace machinery: dev-dependency features reach the test and
# all-targets builds and nothing else.
rusqlite = { version = "0.40.2", features = ["bundled", "trace"] }

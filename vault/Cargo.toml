[package]
name = "yougori-vault"
version = "1.0.7"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# This executable requires administrator protection. Tests live in the library;
# Cargo's synthetic binary test harness cannot be launched without elevation.
[[bin]]
name = "yougori-vault"
path = "src/main.rs"
test = false
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
age = "0.12.1"
chrono = "0.4"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
rcgen = "0.14.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
axum = "0.8"
subtle = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_WindowsProgramming", "Win32_System_Pipes", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

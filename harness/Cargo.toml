[package]
name = "yougori-harness"
version = "1.2.5"
edition = "2021"
description = "The Yougori harness: our own terminal agent, holding every inference harness behind one screen"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "yougori-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
globset = "0.4"
ignore = "0.4"
libc = "0.2"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "fs", "signal"] }
toml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.18"

[dev-dependencies]
insta = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

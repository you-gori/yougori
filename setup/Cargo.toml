[package]
name = "yougori-setup"
version = "1.2.2"
description = "Shared template and setup contracts: formats, capabilities, conditions, planning"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
semver = "1"

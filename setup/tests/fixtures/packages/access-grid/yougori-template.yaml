format_version: 2
kind: template
name: access-grid
title: Access Grid
subtitle: Let agents use approved credentials without receiving their values.
summary: Keep company API keys in one place. People and their agents call services through it under your rules, and never see the values.
version: 1.0.0
license: MIT
topics: [grid, credentials, security, agents, team]
aliases: [access grid, credential broker, company credentials, api keys, agent access]
profile: access_grid
changelog: First version as a template. Creates an Access Grid with its first admin and, optionally, its first credential and rule, or signs a person in to one.

requires:
  yougori: 1.2.0
  platforms: [windows-x86_64, linux-x86_64]

capabilities:
  - {id: grid.create, selection: required, when: {mode: create}}
  - {id: grid.join, selection: required, when: {mode: person}}
  - {id: people.team, selection: required}
  - {id: people.roles, selection: optional, when: {mode: create}}
  - {id: people.invites, selection: optional}
  - {id: people.scoped_credentials, selection: required}
  - {id: people.mfa, selection: default}
  - {id: people.sso, selection: optional, when: {mode: create}}
  - {id: web.service, selection: required, when: {mode: create}}
  - {id: web.lan, selection: optional, when: {mode: create}}
  - {id: web.quick_link, selection: optional, when: {mode: create}}
  - {id: web.domain, selection: optional, when: {mode: create}}
  - {id: run.service, selection: required, when: {mode: create}}
  - {id: run.quotas, selection: optional, when: {mode: create}}
  - {id: run.health_logs, selection: optional}

inputs:
  - id: mode
    question: What do you want to do?
    type: choice
    group: grid_workers
    choices:
      - {value: create, label: "Create an Access Grid", hint: "This computer keeps the credentials."}
      - {value: person, label: "Sign in to an Access Grid", hint: "Use credentials your admin approved."}
    default: create

  # Create: the broker itself.
  - id: grid_name
    question: What is the company or team called?
    hint: Shown to everyone who signs in. Up to 64 characters.
    type: text
    pattern: "^.{1,64}$"
    group: people_access
    when: {mode: create}
  - id: coordinator_address
    question: What is this computer's private network address?
    hint: An address on your LAN or VPN, such as 192.168.1.20. Yougori suggests one; people sign in here.
    type: text
    pattern: "^[0-9A-Fa-f.:]{2,45}$"
    group: grid_workers
    when: {mode: create}
  - id: reach
    question: Where can people sign in from?
    type: choice
    group: website_api
    choices:
      - {value: lan, label: "This network only", hint: "Computers on your LAN or VPN."}
      - {value: quick, label: "A quick public link", hint: "A free HTTPS link. It can change after a restart."}
      - {value: domain, label: "My own domain", hint: "A domain you saved with yougori domain add."}
    default: lan
    when: {mode: create}
  - id: domain
    question: Which saved domain?
    type: domain
    group: website_api
    when: {mode: create, reach: domain}

  # Create: the first admin, who owns the broker.
  - id: admin_username
    question: Your username as the first admin
    hint: 3 to 32 letters, digits, dots, dashes or underscores.
    type: text
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,31}$"
    group: people_access
    when: {mode: create}
  - id: admin_name
    question: Your name, as others see it
    type: text
    required: false
    pattern: "^.{0,64}$"
    group: people_access
    when: {mode: create}
  - id: admin_password
    question: Your password
    hint: At least 10 characters. This is your own sign-in, not a shared password.
    type: secret
    min_length: 10
    group: people_access
    when: {mode: create}
  - id: require_two_step
    question: Require two-step sign-in for everyone?
    hint: People turn it on with an authenticator app before they can use any credential.
    type: yesno
    default: false
    group: people_access
    when: {mode: create}
  # Create: optionally, the first credential and who may use it.
  - id: first_credential
    question: Add the first credential now?
    hint: You can add credentials later from the Credentials view, including OAuth, GitHub App and AWS ones.
    type: yesno
    default: false
    group: people_access
    when: {mode: create}
  - id: credential_name
    question: Name for the credential
    hint: How people and agents ask for it, such as github or billing-api.
    type: text
    pattern: "^.{1,64}$"
    group: people_access
    when: {mode: create, first_credential: "yes"}
  - id: credential_kind
    question: How is it sent?
    type: choice
    group: people_access
    choices:
      - {value: bearer, label: "Bearer token", hint: "Authorization: Bearer VALUE"}
      - {value: header, label: "In a header", hint: "Such as X-Api-Key: VALUE"}
      - {value: basic, label: "Basic sign-in", hint: "A username and the value as its password."}
      - {value: query, label: "In the address", hint: "Such as ?api_key=VALUE"}
    default: bearer
    when: {mode: create, first_credential: "yes"}
  - id: credential_field
    question: Where does the value go?
    hint: The header name (such as X-Api-Key), the query parameter (such as api_key) or, for basic sign-in, the username sent with it.
    type: text
    pattern: '^[^:\s]{1,128}$'
    group: people_access
    when: {mode: create, first_credential: "yes", credential_kind: [header, query, basic]}
  - id: credential_destination
    question: Which service may it be sent to?
    hint: An https:// address with an optional path prefix, such as https://api.github.com. Requests anywhere else are refused.
    type: text
    pattern: '^https://[^\s]{1,1000}$'
    group: people_access
    when: {mode: create, first_credential: "yes"}
  - id: credential_value
    question: The credential's value
    hint: Sealed on this computer at once. Nobody can read it back; agents only get the service's answers.
    type: secret
    group: people_access
    when: {mode: create, first_credential: "yes"}
  - id: rule_decision
    question: When someone uses it, what happens?
    type: choice
    group: people_access
    choices:
      - {value: ask, label: "An approver decides each time", hint: "The safest choice to start with."}
      - {value: standing, label: "Allowed", hint: "Within the methods and path you choose."}
      - {value: never, label: "Never", hint: "Nobody may use it until you add a rule."}
    default: ask
    when: {mode: create, first_credential: "yes"}
  - id: rule_methods
    question: Which kinds of request?
    type: multichoice
    group: people_access
    choices:
      - {value: get, label: "GET"}
      - {value: head, label: "HEAD"}
      - {value: post, label: "POST"}
      - {value: put, label: "PUT"}
      - {value: patch, label: "PATCH"}
      - {value: delete, label: "DELETE"}
      - {value: options, label: "OPTIONS"}
    default: [get]
    when: {mode: create, first_credential: "yes", rule_decision: [ask, standing]}
  - id: rule_path
    question: Only under this path
    hint: Such as /repos/acme. Leave empty for any path at that service.
    type: text
    required: false
    pattern: '^(/[^?#\s]{0,511})?$'
    group: people_access
    when: {mode: create, first_credential: "yes", rule_decision: [ask, standing]}
  - id: rule_hourly_limit
    question: Uses an hour per person before an approver must decide
    hint: Leave empty for no limit.
    type: number
    required: false
    min: 1
    max: 100000
    group: automation_recovery
    when: {mode: create, first_credential: "yes", rule_decision: standing}
  - id: rule_hours
    question: Let the rule lapse after how many hours?
    hint: Leave empty to keep it until you remove it. At most one year.
    type: number
    required: false
    min: 1
    max: 8760
    group: automation_recovery
    when: {mode: create, first_credential: "yes", rule_decision: [ask, standing]}

  # Person: sign in to someone else's Access Grid.
  - id: person_invite
    question: Paste the invite your admin gave you
    hint: It starts with access-invite:.
    type: secret
    group: people_access
    when: {mode: person}
  - id: person_username
    question: Your username
    type: text
    pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,31}$"
    group: people_access
    when: {mode: person}
  - id: person_password
    question: Your password
    type: secret
    group: people_access
    when: {mode: person}

retention:
  on_stop: keep
  on_remove: keep

views: [people, credentials, policies, approvals, audit, logs]

steps:
  - title: Add people and approvers
    detail: In the People view, add each person with a username, a permission (member, approver, auditor or admin) and optional teams. Send them the invite and their username privately; they run this template with "Sign in to an Access Grid".
    when: {mode: create}
  - title: Connect an agent
    detail: On a computer where a person is signed in, add the MCP server shown below to the agent's settings, or call yougori access use from a script. The agent gets the service's answer, never the credential.
  - title: Turn on two-step sign-in
    detail: In My account, turn on two-step sign-in with an authenticator app.
    when: {mode: person}

outputs:
  - {key: grid_name, label: Access Grid, value: "{{outputs.company.name}}", when: {mode: create}}
  - {key: grid_page, label: Access Grid page, value: "{{outputs.company.page}}", when: {mode: create}}
  - {key: join_address, label: Sign-in address, value: "{{outputs.company.join_address}}", when: {mode: create}}
  - {key: broker, label: Broker address, value: "{{outputs.broker.endpoint}}", when: {mode: create}}
  - {key: invite, label: Invite for people, value: "{{outputs.company.invitation}}", private: true, when: {mode: create}}
  - {key: person_grid, label: Access Grid, value: "{{outputs.person_session.name}}", when: {mode: person}}
  - {key: mcp_server, label: MCP server for agents, value: "yougori access mcp"}
